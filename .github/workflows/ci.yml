name: Django CI/CD

on:
  push:
    branches: [main, ci-setup]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: blog_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kevito11
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django tests
      run: |
        python manage.py test

    - name: Build Docker image
      run: docker build -t django-app .

    - name: Save Docker image as artifact
      run: docker save django-app > django-app.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: django-app-image
        path: django-app.tar
